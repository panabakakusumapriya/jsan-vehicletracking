plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vtstracker'
version = '0.1.0'

android {
  namespace "expo.modules.vtstracker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Match the version expo-location and react-native-maps already pull in, so Gradle
  // never has to resolve a conflict.
  implementation "com.google.android.gms:play-services-location:21.0.1"
}
