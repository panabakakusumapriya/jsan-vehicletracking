          <rect x="12.4" y="8.4" width="7.6" height="7.6" rx="1.6"/>
          <rect x="1.2" y="14.5" width="19.8" height="2.7" rx="1.3"/>
          <circle cx="6.6" cy="18.7" r="2.75"/>
          <circle cx="16.4" cy="18.7" r="2.75"/>
        </g>
        <g fill="#000">
          <rect x="14.1" y="9.9" width="4.4" height="3.3" rx="0.9"/>
          <circle cx="6.6" cy="18.7" r="1.15"/>
          <circle cx="16.4" cy="18.7" r="1.15"/>
        </g>
